# Pull-request validation: typecheck, lint, both test suites, and a production build.
# Uses no secrets and read-only repository access; it does not deploy anything.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; every push to main is validated.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        id: install
        run: npm ci

      # Each check runs even if an earlier one failed, so one run reports every problem.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Unit and source tests (node:test)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Component tests (Vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:components

      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
